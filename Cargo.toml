[package]
name = "evallerina"
version = "0.1.0"
edition = "2024"
description = "Eval battery for the dulce-de-leche tool family: do LLM agents actually use the suite's AIX output channels?"
license = "Apache-2.0"
repository = "https://github.com/charly-vibes/evallerina"
readme = "README.md"

[lib]
name = "evallerina"

[[bin]]
name = "evallerina"
path = "src/main.rs"

[dependencies]
genesis-vibes = { git = "https://github.com/charly-vibes/genesis", tag = "v0.12.3" }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
