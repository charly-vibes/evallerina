# Tier-0 gate + tier-1 nightly replay for the evallerina eval battery.
#
# Per genesis docs/how-to/evals-ci.md:
# - tier 0 runs on every push/PR and gates it (no model, seconds)
# - tier 1 replays recorded transcripts nightly (no model, no network);
#   a replay failure is a regression signal, not a flake
# - tier 2 (live model runs) is a separate scheduled workflow
#   (evals-rotation.yml) that never gates a push
#
# Uses `just ci` / `just tier1` for parity with local development.

name: evals

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # nightly, off-peak

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  tier0:
    name: Tier 0 — static gate
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Routing-parity source of truth (evallerina-0sy, design D2):
      # ddl's MANAGED-TOOLS block. Checked out next to the repo root so
      # the gate enforces in CI instead of degrading to a warning.
      - name: Checkout dulce-de-leche sibling (MANAGED-TOOLS source of truth)
        uses: actions/checkout@v4
        with:
          repository: charly-vibes/dulce-de-leche
          path: dulce-de-leche

      # First-party routing siblings: routing.toml repo paths must
      # resolve from the repo root (stale-path check), so every
      # first-party entry's checkout must exist in CI. Local dev
      # workspaces have them; standalone clones degrade via the absent
      # ddl sibling, never silently.
      - name: Check out first-party routing siblings (../<name>)
        run: |
          mv dulce-de-leche ../dulce-de-leche
          for repo in wai genesis espectacular dont testaruda whisper pretender vampiro incitaciones specodelic funkalization wild; do
            git clone --quiet --depth 1 "https://github.com/charly-vibes/${repo}.git" "../${repo}"
          done

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: extractions/setup-just@v2

      # The routing-parity tests (tests/routing.rs) drive the bd CLI in
      # sandboxes (Sandbox::with_beads -> bd init); the runner image has
      # no bd, which left the push gate red since evallerina-0sy
      # (evallerina-ean). Install the official release binary (pinned
      # version, checksum-verified) so CI and dev exercise identical
      # routing semantics.
      - name: Install bd (beads CLI for routing-parity sandboxes)
        env:
          BD_VERSION: v1.3.2
        run: |
          curl -fsSLo /tmp/beads.tgz \
            "https://github.com/gastownhall/beads/releases/download/${BD_VERSION}/beads_${BD_VERSION#v}_linux_amd64.tar.gz"
          curl -fsSLo /tmp/checksums.txt \
            "https://github.com/gastownhall/beads/releases/download/${BD_VERSION}/checksums.txt"
          grep "linux_amd64" /tmp/checksums.txt | sed 's|beads_[^ ]*linux_amd64.tar.gz|/tmp/beads.tgz|' | (cd /tmp && sha256sum -c -)
          tar -xzf /tmp/beads.tgz -C /tmp bd
          sudo mv /tmp/bd /usr/local/bin/bd
          bd version

      - name: Run tier 0 (fmt, clippy -D warnings, tests)
        run: just tier0

  tier1-replay:
    name: Tier 1 — nightly replay
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Replay recorded failure modes
        run: just tier1
