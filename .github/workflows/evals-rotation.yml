# Tier-2 scheduled rotation (scenario × model cells).
#
# Split out of evallerina-5ap (the rotation workflow is evallerina-aay).
# The live runner it invokes landed with evallerina-1vw (src/live.rs —
# OpenRouter :free action protocol); this workflow iterates the ordered
# model registry (:free ids first) × the live scenario battery and
# prints one JSON event per cell: a report_version 1 trial row, or an
# absent record when the per-run wall-clock budget skipped the cell.
# Live runs NEVER gate a push (schedule + manual dispatch only).
#
# Budget rules per evals-ci.md: :free ids first, marginal cost ~zero USD;
# a per-run wall-clock budget applies (--budget-mins) — cells skipped
# past the window are recorded as absent, not failed. 429 semantics
# (one >=2s retry, then rate_limited, never silent model substitution)
# live in the runner. Requires the OPENROUTER_API_KEY repo secret;
# without it the run fails loudly (no silent degradation).

name: evals-rotation

on:
  workflow_dispatch: {}
  # Weekly rotation (7-day cycle, within the <=14-day budget): Monday
  # 04:00 UTC — after the tier-1 replay window (0 3 * * *).
  schedule:
    - cron: "0 4 * * 1"

concurrency:
  group: evals-rotation
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# The persist step (evallerina-17o) commits rotation rows back to main.
permissions:
  contents: write

jobs:
  rotation:
    name: Tier 2 — live rotation (scenario × model cells)
    runs-on: ubuntu-latest
    # Job ceiling 30 min vs --budget-mins 20 (15 rotation + 5 ablation): the
    # slack lets the runner finish the trial in flight and record every
    # skipped cell absent.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The eval targets themselves, pinned to released tags: the
      # trials execute the tools, so the runner needs them on PATH.
      - name: Install eval targets (wai, dont)
        run: |
          cargo install --locked --git https://github.com/charly-vibes/wai --tag v2026.10.9
          cargo install --locked --git https://github.com/charly-vibes/dont --tag v0.4.0

      - name: Run tier-2 rotation
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p reports
          # Budget split (evallerina-vvt): rotation 15 mins + ablation 5 mins
          # = the same 20-minute total, still under the 30-min job ceiling.
          cargo run --release -- live --budget-mins 15 \
            | tee -a reports/tier2-rotation.jsonl

      # Ablation cells (evallerina-vvt): produce arm=ablated rows next to
      # the arm=full rotation rows in the same run. Gated if: always() so
      # a failed/absent rotation never prevents ablation rows from being
      # attempted or recorded. `wai` is already on PATH from the install
      # step above, so --real-artifacts works; the ablate CLI refuses to
      # fake artifacts loudly if it is absent. The reports/ dir was created
      # by the rotation step (mkdir runs first there, before any failure
      # exit); re-assert it here since this step runs unconditionally.
      # One representative scenario per rotation keeps the budget honest.
      - name: Run ablation cells
        if: always()
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p reports
          cargo run --release -- ablate wai-hint-adherence-corrupt-config \
            --real-artifacts --budget-mins 5 --out reports/ablation-cells.jsonl
          cat reports/ablation-cells.jsonl | tee -a reports/tier2-rotation.jsonl

      # Aggregate the rows into the fault dashboard and run the
      # fault-routing step in its dry-run default: the additive routed
      # summary lands in the dashboard and proposed-tickets.jsonl is
      # written next to the report for review. Filing proposed tickets
      # is a cross-repo write that stays behind explicit local
      # authorization — CI must NEVER file.
      - name: Aggregate + route (dry-run)
        run: |
          cargo run --release -- report reports/tier2-rotation.jsonl --route

      # Persist the rows in-repo (evallerina-17o): GHA artifacts expire,
      # and the fault dashboard must be reviewable without GHA access.
      # Append-only: new rows are appended to the tracked jsonl and
      # committed; no rows -> no commit (git commit --allow-empty is
      # intentionally NOT used, so an absent/skipped rotation is silent).
      - name: Persist rotation rows in-repo
        if: always()
        run: |
          if [ -f reports/tier2-rotation.jsonl ]; then
            git config user.name "evallerina-rotation-bot"
            git config user.email "evallerina-rotation-bot@users.noreply.github.com"
            git add -f reports/tier2-rotation.jsonl
            if ! git diff --cached --quiet; then
              git commit -m "chore(reports): append tier-2 rotation rows ($(date -u +%F))"
              git push
            else
              echo "no new rows (absent/skipped rotation) — nothing to persist"
            fi
          else
            echo "no rows produced this rotation"
          fi

      - name: Upload rotation rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier2-rotation
          path: reports/tier2-rotation.jsonl

      - name: Upload proposed tickets (dry-run artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proposed-tickets
          if-no-files-found: warn
          path: reports/proposed-tickets.jsonl
