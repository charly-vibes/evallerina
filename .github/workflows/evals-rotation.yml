# Tier-2 scheduled rotation scaffold (scenario × model cells).
#
# Split out of evallerina-5ap (the rotation workflow is evallerina-aay).
# This file is the scheduling/budget shell only: the live runner it
# invokes is built by evallerina-1vw (src/live.rs — OpenRouter :free
# action protocol). The workflow stays dormant (manual dispatch only)
# until the runner exists, and live runs NEVER gate a push.
#
# Budget rules per evals-ci.md: :free ids first, marginal cost ~zero USD;
# a per-run wall-clock budget applies — cells skipped past the window are
# recorded as absent, not failed. 429 semantics (one >=2s retry, then
# rate_limited, never silent model substitution) live in the runner.

name: evals-rotation

on:
  workflow_dispatch: {}
  # Scheduled rotation enables here once the live runner lands
  # (evallerina-1vw): cron: "0 4 * * *" — after the tier-1 replay window.

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rotation:
    name: Tier 2 — live rotation (dormant until evallerina-1vw)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Runner not yet implemented
        run: |
          echo "Tier-2 rotation is scaffolded but dormant: the live runner"
          echo "(src/live.rs, OpenRouter :free action protocol) is built by"
          echo "evallerina-1vw. Enable the schedule cron at that point."
          exit 1
